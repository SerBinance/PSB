const $=s=>document.querySelector(s),app=$("#app");
const sh=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
let run=[],i=0,sc=0,miss=[],tp=[],ans=false,cur=null,left=0,tid=null,up=false;
function home(){
 app.innerHTML=`<h1>PSB 241 CBT practice</h1><p>Each round draws 70 random questions from a bank of ${Q.length}, in a new order every time. After each answer you get a one-line explanation, whether you were right or wrong.</p><p>You get 35 minutes, and the timer starts when you press Start. Keys: 1–4 to answer, Enter for next.</p><button class="pri" id="go">Start quiz</button>`;
 $("#go").onclick=()=>start(Q);
}
function start(src){run=sh(src.slice());if(src===Q)run=run.slice(0,70);i=0;sc=0;miss=[];tp=T.map(()=>[0,0]);clearInterval(tid);left=35*60;up=false;tid=setInterval(tick,1000);show()}
function show(){
 const x=run[i];ans=false;
 const o=sh([x[2],x[3],x[4],x[5]]);cur={o,c:o.indexOf(x[2])};
 app.innerHTML=`<div class="top"><span>Question ${i+1} of ${run.length}</span><span class="tm${left<=300?" low":""}" id="tm">${fmt(left)}</span><span>Score ${sc}</span></div><div class="bar"><i style="width:${i/run.length*100}%"></i></div><span class="chip">${T[x[0]]}</span><h2>${x[1]}</h2><div>${o.map((t,k)=>`<button class="opt" data-k="${k}"><b>${"ABCD"[k]}</b><span>${t}</span></button>`).join("")}</div><div id="fb"></div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 window.scrollTo(0,0);
}
function pick(k){
 if(ans)return;ans=true;const x=run[i],ok=k===cur.c;
 tp[x[0]][1]++;if(ok){sc++;tp[x[0]][0]++}else miss.push(x);
 app.querySelectorAll(".opt").forEach((b,n)=>{b.disabled=true;if(n===cur.c)b.classList.add("ok");else if(n===k)b.classList.add("no")});
 const f=$("#fb");
 f.innerHTML=`<div class="fb ${ok?"ok":"no"}"><strong>${ok?"Correct":"Not quite"}</strong>${x[6]}</div><button class="pri" id="nx">${i+1<run.length?"Next question":"See results"}</button>`;
 $("#nx").onclick=next;f.scrollIntoView({block:"nearest",behavior:"smooth"});
}
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function tick(){left--;const t=$("#tm");if(t){t.textContent=fmt(left);t.classList.toggle("low",left<=300)}if(left<=0){clearInterval(tid);up=true;end()}}
function next(){i++;i<run.length?show():end()}
function end(){
 clearInterval(tid);const n=run.length,p=Math.round(sc/n*100);
 app.innerHTML=`<h1>${p>=90?"Excellent":p>=70?"Good progress":"Keep drilling"}</h1><div class="big">${p}%</div><p>${up?"Time’s up. ":""}${sc} of ${n} correct${up?" (unanswered count as wrong)":""}</p>
 ${T.map((t,k)=>tp[k][1]?`<div class="row"><span>${t}</span><div class="bar"><i style="width:${tp[k][0]/tp[k][1]*100}%"></i></div><em>${tp[k][0]}/${tp[k][1]}</em></div>`:"").join("")}
 <div style="height:16px"></div>
 ${miss.length?`<button class="pri" id="rm">Retry ${miss.length} missed</button>`:""}
 <button class="${miss.length?"sec":"pri"}" id="nr">New shuffled round</button>
 ${miss.length?`<h2>Review missed</h2>${miss.map(x=>`<details><summary>${x[1]}</summary><p><b>${x[2]}</b><br>${x[6]}</p></details>`).join("")}`:""}`;
 const m=miss.slice();
 if($("#rm"))$("#rm").onclick=()=>start(m);
 $("#nr").onclick=()=>start(Q);
 window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{
 if(!run.length||!$(".opt"))return;
 if(!ans&&"1234".includes(e.key))pick(+e.key-1);
 else if(ans&&(e.key==="Enter"||e.key==="ArrowRight")&&$("#nx"))next();
});
home();
</script></body></html>
